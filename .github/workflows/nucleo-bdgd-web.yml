name: Núcleo de Dados BDGD — web 2025
on:
  push:
    branches:
      - "feat/nucleo-dados-bdgd-portal"
      - "feat/dashboard-bdgd-2025"
    paths:
      - "nucleo-dados-bdgd/web/**"
      - "nucleo-dados-bdgd/motor_universal/**"
      - "nucleo-dados-bdgd/motor_cenarios/**"
      - "nucleo-dados-bdgd/motor_v2/metric_contract.py"
      - "nucleo-dados-bdgd/motor_v2/audit_public_products.py"
      - "nucleo-dados-bdgd/motor_v2/tests/**"
      - "nucleo-dados-bdgd/etl/**"
      - "nucleo-dados-bdgd/output-publicavel/**"
      - "nucleo-dados-bdgd/output-historico/**"
      - "nucleo-dados-bdgd/auditoria/**"
      - ".github/workflows/nucleo-bdgd-web.yml"
  pull_request:
    paths:
      - "nucleo-dados-bdgd/web/**"
      - "nucleo-dados-bdgd/motor_universal/**"
      - "nucleo-dados-bdgd/motor_cenarios/**"
      - "nucleo-dados-bdgd/motor_v2/metric_contract.py"
      - "nucleo-dados-bdgd/motor_v2/audit_public_products.py"
      - "nucleo-dados-bdgd/motor_v2/tests/**"
      - "nucleo-dados-bdgd/etl/**"
      - "nucleo-dados-bdgd/output-publicavel/**"
      - "nucleo-dados-bdgd/output-historico/**"
      - "nucleo-dados-bdgd/auditoria/**"
permissions:
  contents: read
concurrency:
  group: nucleo-bdgd-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Lint, tipos, testes, build e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nucleo-dados-bdgd/web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node
        run: node --version && npm --version
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários (semântica de consulta)
        run: npm test
      - name: Resumo do motor universal corresponde ao Parquet e ao código
        working-directory: nucleo-dados-bdgd
        run: |
          python3 -m venv "$RUNNER_TEMP/motor-web-env"
          "$RUNNER_TEMP/motor-web-env/bin/python" -m pip install -r motor_universal/requirements.txt
          "$RUNNER_TEMP/motor-web-env/bin/python" -m motor_universal --output "$RUNNER_TEMP/motor-web-check" --web-summary web/public/data/previsoes/motor-universal-resumo.json.gz --check-web
      - name: Motor de cenários — testes e regeneração idêntica do produto publicado
        working-directory: nucleo-dados-bdgd
        run: |
          "$RUNNER_TEMP/motor-web-env/bin/python" -m pip install -r motor_universal/requirements-ml.txt
          "$RUNNER_TEMP/motor-web-env/bin/python" -m unittest discover -s motor_cenarios -p 'test_*.py' -v
          "$RUNNER_TEMP/motor-web-env/bin/python" motor_cenarios/cenarios.py output-historico/contrato-integracao motor_cenarios/entrada motor_cenarios/entrada motor_cenarios/saida web/public/data/previsoes/cenarios-motor.json --check
      - name: Contrato de natureza física — testes e auditoria dos produtos públicos (contagem fracionária ou negativa reprova)
        working-directory: nucleo-dados-bdgd
        run: |
          "$RUNNER_TEMP/motor-web-env/bin/python" -m unittest discover -s motor_v2/tests -v
          "$RUNNER_TEMP/motor-web-env/bin/python" -m motor_v2.audit_public_products --output "$RUNNER_TEMP/auditoria_produtos_publicos.json"
      - name: Contrato de dados (smoke)
        run: node ../etl/tests/smoke.mjs
      - name: Validar pacote publicado 2025-12-31 (gate obrigatório)
        run: |
          test -f ../output-publicavel/2025-12-31/manifest.json || { echo "::error::pacote 2025-12-31 ausente: o gate de release não pode ser pulado"; exit 1; }
          node ../etl/validate-publication.mjs ../output-publicavel/2025-12-31
      - name: Assets web derivados do mesmo pacote
        run: |
          node -e 'const m=require("../output-publicavel/2025-12-31/manifest.json"),a=require("./public/data/2025-12-31/assets.json"),i=require("./public/data/2025-12-31/index.json");if(a.release_id!==m.release_id||i.release.release_id!==m.release_id||i.release.data_base!=="2025-12-31"){console.error("release_id divergente",m.release_id,a.release_id,i.release.release_id);process.exit(1)}console.log("assets =",m.release_id,"status",m.status)'
          npm run validate:data
      - name: Validar série histórica 2022-2025 (somente células validadas têm valor)
        run: node ../etl/validate-serie-historica.mjs ../output-historico/2022-2025 public/data/historico/serie.json
      - name: Validar matriz de homologação aplicada à Evolução (N/D nunca vira valor; Brasil 2022-2023 sem total nacional)
        run: node ../etl/validate-homologacao-web.mjs ../auditoria/fase4 public/data/historico/homologacao.json public/data/historico/serie.json
      - name: Validar contrato de integração nacional (consumido pelo motor do PR #6)
        run: node ../etl/validate-contrato-nacional.mjs ../output-historico/contrato-integracao ../auditoria/fase4/MATRIZ_HOMOLOGACAO_2022_2025.csv
      - name: Build estático
        run: npm run build
      - name: Cenários e estados correspondem ao contrato versionado
        run: node ../etl/bdgd2025/88_cenarios_exploratorios.mjs --source-commit e5115f49b67e18d6939f6559990341fefebece9c --check
      - name: Auditoria independente de publicações, estados, OLS e backtests
        run: python3 ../etl/tests/auditoria_pr6.py
      - name: Chrome do runner para E2E
        run: google-chrome --version
      - name: E2E (desktop, Android e iPhone estreito emulado)
        env:
          CI: "1"
        run: npx playwright test
      - name: Evidências Playwright (relatório, capturas e traces de falhas)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-desktop-mobile-${{ github.run_id }}
          path: |
            nucleo-dados-bdgd/web/playwright-report
            nucleo-dados-bdgd/web/test-results
          retention-days: 14
          if-no-files-found: warn
