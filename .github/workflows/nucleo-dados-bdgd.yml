name: Núcleo de Dados BDGD — checks 2025
on:
  push:
    branches:
      - "feat/nucleo-dados-bdgd-portal"
    paths:
      - "nucleo-dados-bdgd/**"
      - ".github/workflows/nucleo-dados-bdgd.yml"
  pull_request:
    paths:
      - "nucleo-dados-bdgd/**"
permissions:
  contents: read
jobs:
  validate:
    name: Validar frontend e contrato de dados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ambiente
        run: node --version
      - name: Verificar sintaxe JavaScript
        run: |
          node --check nucleo-dados-bdgd/app.js
          node --check nucleo-dados-bdgd/etl/validate-publication.mjs
          node --check nucleo-dados-bdgd/etl/tests/smoke.mjs
      - name: Testar contrato BDGD 31-12-2025
        run: node nucleo-dados-bdgd/etl/tests/smoke.mjs
