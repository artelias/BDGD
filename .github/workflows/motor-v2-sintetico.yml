name: Motor V2 — testes sintéticos (sem dados locais)
on:
  push:
    branches:
      - "feat/motor-v2-granular-territorial"
    paths:
      - "nucleo-dados-bdgd/motor_v2/**"
      - ".github/workflows/motor-v2-sintetico.yml"
  pull_request:
    paths:
      - "nucleo-dados-bdgd/motor_v2/**"
      - ".github/workflows/motor-v2-sintetico.yml"
permissions:
  contents: read
jobs:
  sintetico:
    name: Hierarquia UCBT ⊂ Consumidores, elegibilidade, cenários e contratos físicos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nucleo-dados-bdgd
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ambiente e dependências fixadas
        run: |
          python3 -m venv "$RUNNER_TEMP/motor-v2-env"
          "$RUNNER_TEMP/motor-v2-env/bin/python" -m pip install -r motor_universal/requirements.txt -r motor_universal/requirements-ml.txt duckdb==2.0.0
      # Suítes que não leem D:/ nem a base de conhecimento local (conferido emulando o bloqueio desses caminhos).
      # As suítes com dados reais (test_features, test_ml, test_scale, test_comparison, test_executor_integration,
      # test_generalization, test_lote, test_v2) rodam na auditoria completa local: python -m motor_v2.nacional.testes
      - name: Testes sintéticos do Motor V2
        run: |
          for t in test_hierarquia test_auditoria_final test_nacional test_baselines test_conj_plan test_future \
                   test_metric_contract test_public_audit test_temporal test_vintage; do
            "$RUNNER_TEMP/motor-v2-env/bin/python" -m unittest discover -s motor_v2/tests -p "$t.py" -v
          done
